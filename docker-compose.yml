services:
  telegram-enhancer-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-enhancer-bot
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=10000
    volumes:
      # Persist AI model weights so it never re-downloads on container restarts
      - ./models:/app/models
